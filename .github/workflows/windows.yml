name: Windows

on:
  push:
    branches:
      - windows
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/OpenCodePhoneProxy/OpenCodePhoneProxy.csproj

      - name: Build
        run: dotnet build src/OpenCodePhoneProxy/OpenCodePhoneProxy.csproj -c Release --no-restore

      - name: Self-test
        run: |
          $exe = (Resolve-Path "src/OpenCodePhoneProxy/bin/Release/net8.0-windows/OpenCodePhoneProxy.exe").Path
          # Start-Process waits for a GUI-subsystem exe and exposes its exit code.
          $process = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Self-test failed with exit code $($process.ExitCode)" }
          Get-Content "$env:TEMP/OpenCodePhoneProxy-selftest.log"

      - name: Publish single-file exe
        run: |
          dotnet publish src/OpenCodePhoneProxy/OpenCodePhoneProxy.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:EnableWindowsTargeting=true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o dist/win-x64

      - name: Package zip
        run: |
          Copy-Item install.ps1, install.cmd, uninstall.ps1, uninstall.cmd, README.txt, README.md dist/win-x64 -Force
          Compress-Archive -Path "dist/win-x64/*" -DestinationPath "dist/OpenCodePhoneProxy-v1.1.0-win-x64.zip" -Force
          Get-ChildItem dist
          $exe = Get-Item "dist/win-x64/OpenCodePhoneProxy.exe"
          "{0:N1} MB" -f ($exe.Length / 1MB)
          $hash = Get-FileHash "dist/OpenCodePhoneProxy-v1.1.0-win-x64.zip" -Algorithm SHA256
          "$($hash.Hash)  OpenCodePhoneProxy-v1.1.0-win-x64.zip" |
            Set-Content "dist/OpenCodePhoneProxy-v1.1.0-win-x64.zip.sha256" -Encoding ascii
          Get-Content "dist/OpenCodePhoneProxy-v1.1.0-win-x64.zip.sha256"

      - name: Smoke-test published exe
        run: |
          $exe = (Resolve-Path "dist/win-x64/OpenCodePhoneProxy.exe").Path
          $version = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow
          if ($version.ExitCode -ne 0) { throw "Published exe failed to start" }
          $selftest = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if ($selftest.ExitCode -ne 0) { throw "Published exe self-test failed" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCodePhoneProxy-v1.1.0-win-x64
          path: |
            windows/dist/OpenCodePhoneProxy-v1.1.0-win-x64.zip
            windows/dist/OpenCodePhoneProxy-v1.1.0-win-x64.zip.sha256
          if-no-files-found: error
